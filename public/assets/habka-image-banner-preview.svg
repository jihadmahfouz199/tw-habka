<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">معاينة بانر صورة حبكة</title>
  <desc id="desc">بانر تجريبي بسيط بتدرج لوني وشعار حبكة</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#background)"/>
  <circle cx="180" cy="80" r="250" fill="#ffffff" opacity=".06"/>
  <circle cx="1450" cy="570" r="360" fill="#ffffff" opacity=".08"/>
  <text x="800" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="78" font-weight="700" text-anchor="middle" direction="rtl">حَبْكة</text>
  <text x="800" y="360" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" direction="rtl" opacity=".86">ضع صورة البانر الخاصة بك هنا</text>
</svg>
