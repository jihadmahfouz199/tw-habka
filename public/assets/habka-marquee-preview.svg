<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">معاينة شريط الإعلانات المتحرك</title>
  <desc id="desc">شريط داكن يحمل إعلاناً عربياً متحركاً وفواصل نجمية</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ee"/>
      <stop offset="1" stop-color="#ece5d7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#263248"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="90" r="170" fill="#c99b52" opacity="0.12"/>
  <circle cx="120" cy="570" r="220" fill="#111827" opacity="0.05"/>
  <text x="600" y="205" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" direction="rtl">شريط الإعلانات المتحرك</text>
  <g filter="url(#shadow)">
    <rect x="70" y="270" width="1060" height="112" rx="22" fill="url(#bar)"/>
    <text x="600" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl">اكتشف أحدث منتجاتنا وعروضنا المميزة</text>
    <text x="196" y="340" fill="#d4a85f" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">✦</text>
    <text x="1004" y="340" fill="#d4a85f" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">✦</text>
  </g>
  <g fill="none" stroke="#9a743b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M463 448h274"/>
    <path d="m479 432-16 16 16 16"/>
    <path d="m721 432 16 16-16 16"/>
  </g>
  <text x="600" y="510" fill="#6b6257" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" direction="rtl">حركة سلسة · متجاوب · يدعم RTL</text>
